<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t">
  <title id="t">A friendly tutor robot in a sandbox with a speech bubble and a stack of books</title>
  <rect width="640" height="400" fill="#e9d9bf"/>
  <!-- sand -->
  <ellipse cx="320" cy="350" rx="250" ry="38" fill="#d9c29a"/>
  <path d="M90 340 q230 -40 460 0" fill="none" stroke="#c7ad83" stroke-width="3" stroke-linecap="round"/>
  <!-- bucket -->
  <path d="M470 270 l14 70 h48 l14 -70z" fill="#a6485a"/>
  <rect x="464" y="262" width="88" height="14" rx="5" fill="#8c3a4a"/>
  <path d="M478 262 q30 -40 60 0" fill="none" stroke="#2a1a12" stroke-width="4" stroke-linecap="round"/>
  <!-- books -->
  <rect x="96" y="304" width="110" height="20" rx="4" fill="#6b7247"/>
  <rect x="104" y="284" width="100" height="20" rx="4" fill="#a85a1c"/>
  <rect x="100" y="264" width="96" height="20" rx="4" fill="#2a1a12"/>
  <rect x="112" y="270" width="72" height="3" fill="#f3e7d3"/>
  <rect x="116" y="290" width="76" height="3" fill="#f3e7d3"/>
  <!-- robot body -->
  <rect x="245" y="170" width="150" height="150" rx="38" fill="#fffdf7" stroke="#2a1a12" stroke-width="5"/>
  <rect x="279" y="225" width="82" height="48" rx="12" fill="#f3e7d3" stroke="#2a1a12" stroke-width="4"/>
  <circle cx="320" cy="249" r="8" fill="#a85a1c"/>
  <!-- arms -->
  <path d="M245 230 q-40 10 -36 58" fill="none" stroke="#2a1a12" stroke-width="6" stroke-linecap="round"/>
  <path d="M395 230 q40 10 36 58" fill="none" stroke="#2a1a12" stroke-width="6" stroke-linecap="round"/>
  <circle cx="209" cy="290" r="9" fill="#fffdf7" stroke="#2a1a12" stroke-width="5"/>
  <circle cx="431" cy="290" r="9" fill="#fffdf7" stroke="#2a1a12" stroke-width="5"/>
  <!-- head -->
  <rect x="258" y="70" width="124" height="104" rx="34" fill="#fffdf7" stroke="#2a1a12" stroke-width="5"/>
  <circle cx="298" cy="120" r="8" fill="#2a1a12"/>
  <circle cx="342" cy="120" r="8" fill="#2a1a12"/>
  <path d="M302 142 q18 14 36 0" fill="none" stroke="#2a1a12" stroke-width="5" stroke-linecap="round"/>
  <circle cx="282" cy="140" r="7" fill="#e8a96e" opacity="0.7"/>
  <circle cx="358" cy="140" r="7" fill="#e8a96e" opacity="0.7"/>
  <!-- antenna -->
  <path d="M320 70 v-22" stroke="#2a1a12" stroke-width="5" stroke-linecap="round"/>
  <circle cx="320" cy="40" r="11" fill="#e8a96e" stroke="#2a1a12" stroke-width="5"/>
  <!-- graduation cap -->
  <path d="M258 78 l62 -26 62 26 -62 22z" fill="#2a1a12"/>
  <path d="M382 78 v26" stroke="#2a1a12" stroke-width="4" stroke-linecap="round"/>
  <circle cx="382" cy="108" r="5" fill="#e8a96e"/>
  <!-- speech bubble -->
  <path d="M410 90 h118 a16 16 0 0 1 16 16 v52 a16 16 0 0 1 -16 16 h-74 l-26 22 v-22 h-18 a16 16 0 0 1 -16 -16 v-52 a16 16 0 0 1 16 -16z" fill="#fffdf7" stroke="#2a1a12" stroke-width="5"/>
  <text x="477" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#2a1a12">hi! ask me</text>
  <!-- sparkles -->
  <path d="M160 120 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" fill="#e8a96e"/>
  <path d="M560 230 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z" fill="#e8a96e"/>
  <path d="M120 200 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#a6485a"/>
</svg>
