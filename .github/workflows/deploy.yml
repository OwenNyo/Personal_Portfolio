name: Publish GitHub Pages redirect

on:
  push:
    branches: [main]
    paths: [github-pages-redirect/**, .github/workflows/deploy.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 404.html catches deep links like /Personal_Portfolio/resume.pdf.
      - run: cp github-pages-redirect/index.html github-pages-redirect/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: github-pages-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
